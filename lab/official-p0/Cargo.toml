[package]
name = "official-task-demo-http"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "rmcp 3.5.1's official Tasks example handler (examples/servers/src/common/task_demo.rs, byte-identical) served over streamable HTTP"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# I-4 repro: agentgateway v1.6.0 (released image, standalone) in front of the lab's unchanged task-server-p0, with one
# remote mcpGuardrails processor that refuses every request. No JWT, so nothing but the processor can refuse.
# Namespace i4-repro is created (and labelled) by run.sh; removed by 'lab/repro-i4/run.sh clean'. Image references are set by run.sh from scripts/versions.env.
apiVersion: v1
kind: ConfigMap
metadata: {name: agw-i4-config, namespace: i4-repro}
data:
  config.yaml: |
    binds:
    - port: 8080
      listeners:
      - routes:
        - matches:
          - path: {exact: /mcp}
          backends:
          - mcp:
              targets:
              - name: shared
                mcp:
                  host: http://task-server-p0.mcp-shared.svc.cluster.local:8080/mcp
          policies:
            mcpGuardrails:
              processors:
              - kind: remote
                host: deny-processor.i4-repro.svc.cluster.local:9000
                failureMode: failClosed
                methods:
                  "tools/call": request
                  "resources/read": request
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agw-i4, namespace: i4-repro}
spec:
  replicas: 1
  selector: {matchLabels: {app: agw-i4}}
  template:
    metadata: {labels: {app: agw-i4}}
    spec:
      containers:
        - name: agentgateway
          image: AGW_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["-f", "/config/config.yaml"]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /config}]
      volumes: [{name: config, configMap: {name: agw-i4-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: agw-i4, namespace: i4-repro}
spec: {selector: {app: agw-i4}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: deny-processor, namespace: i4-repro}
spec:
  replicas: 1
  selector: {matchLabels: {app: deny-processor}}
  template:
    metadata: {labels: {app: deny-processor}}
    spec:
      containers:
        - name: deny-processor
          image: DENY_IMAGE
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 9000}]
---
apiVersion: v1
kind: Service
metadata: {name: deny-processor, namespace: i4-repro}
spec: {selector: {app: deny-processor}, ports: [{port: 9000}]}
